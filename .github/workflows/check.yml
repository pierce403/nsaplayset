name: Check static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate production
        run: bash scripts/build.sh
      - name: Build and validate preview
        run: bash scripts/build.sh
        env:
          CF_PAGES_BRANCH: ci-preview
          CF_PAGES_URL: https://ci-preview.nsaplayset.pages.dev
      - name: Restore production output for artifact
        run: bash scripts/build.sh
      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: nsaplayset-static
          path: public/
