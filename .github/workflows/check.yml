name: Check static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zola
        run: bash scripts/install-zola.sh
      - name: Build
        run: .tools/zola build
      - name: Check routes and local links
        run: python3 scripts/check-site.py
      - name: Check JavaScript syntax
        run: node --check static/catalog.js
      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: nsaplayset-static
          path: public/
